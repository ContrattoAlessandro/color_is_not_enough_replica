data:
  annotations: C:/Users/alexa/Desktop/Tesi_Autonomous_Driving/DTLD/v2.0
  images: C:/Users/alexa/Desktop/Tesi_Autonomous_Driving/DTLD_jpg_plain
  prepared: artifacts/data_validation
model:
  architecture: yolov8m.yaml
  global_head: set_null
  set_topk: 64
  weights: artifacts/pretrained/yolov8m.pt
  channels: 64
  prior_conf: 0.05
  nms_iou: 0.7
  max_det: 300
train:
  seed: 42
  epochs: 15
  batch_size: 8
  effective_batch: 16
  workers: 4
  prefetch_factor: 2
  persistent_workers: true
  cudnn_benchmark: true
  lr: 0.0001
  weight_decay: 0.0001
  gamma: 0.95
  amp: true
  blur_probability: 0.1
  global_weighting: inverse_sqrt
  output: artifacts/augmentation_ps/seed42
  augmentation_statistics: true
  augmentation:
    version: 2
    clean_fraction: 0.25
    max_operations: 2
    probabilities:
      P: 0.5
      S: 0.25
      blur: 0.1
    ranges:
      exposure: [-0.35, 0.35]
      gamma: [0.85, 1.15]
      contrast: [0.85, 1.15]
      noise: [1.0, 4.0]
      downsample: [0.8, 1.0]
      blur: [0.1, 1.0]
validation:
  enabled: true
  every_epochs: 1
  selection_metric: global_mAP
evaluate:
  conf: 0.001
  batch_size: 8
  workers: 4
  prefetch_factor: 2
  persistent_workers: true
